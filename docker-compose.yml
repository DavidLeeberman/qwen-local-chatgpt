version: '3.9'

services:
  postgres:
    image: postgres:14
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file: .env
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d qwen"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    # command: >
    #   sh -c "ollama serve & sleep 5 && ollama pull qwen3.5:9b && wait"
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 20gb        # The "Hard Limit" - Docker will kill the container if it exceeds this
        reservations:
          memory: 8gb         # The "Soft Limit" - Docker tries to guarantee at least this much
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # 🔥 Add healthcheck tool
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai:latest
    env_file: .env
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN} # If loading gated models
      - NCCL_DEBUG=INFO
      # - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    ports:
      - "${VLLM_PORT}:10000"
    ipc: host # 🔥 CRITICAL: Gives PyTorch/vLLM shared memory access for raw tensor calculations
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      Qwen/Qwen3.5-9B
      --port 10000 
      --max-model-len 32768 
      --gpu-memory-utilization 0.90
      --max-num-seqs 24
      --enable-log-requests
    # 🔥 Container-native check using the underlying Python runtime environment
    healthcheck:
      # test: ["CMD-SHELL", "curl -f http://localhost:10000/health || exit 1"]
      test: ["CMD", "python3", "-m", "urllib.request", "http://localhost:10000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  flask:
    build:
      context: ./backend-flask
    volumes:
      - ./backend-flask:/app
    env_file: .env
    ports:
      - "${FLASK_PORT}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy # 🔥 Wait until healthcheck passes
      vllm:
        condition: service_healthy # 🔥 Wait until healthcheck passes
    # environment:
      # - http_proxy=http://192.168.0.107:9910
      # - https_proxy=http://192.168.0.107:9910
      # - HTTP_PROXY=http://192.168.0.107:9910
      # - HTTPS_PROXY=http://192.168.0.107:9910
      # - NO_PROXY=localhost,127.0.0.1,ollama,postgres,flask,node
      # - HF_ENDPOINT=https://hf-mirror.com
      # - JWT_SECRET=super-secret-key-change-this-to-very-long-random-string-123456
    restart: unless-stopped

  node:
    build:
      context: ./backend-node
    env_file: .env
    volumes:
      - ./backend-node:/app
      - /app/node_modules
    ports:
      - "${NODE_PORT}:8000"
    depends_on:
      - flask
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
    environment:
      - VITE_SSE_PREFIX=${SSE_PREFIX}
      - VITE_SSE_DELIMITER=${SSE_DELIMITER}
      - VITE_SSE_CHUNK=${SSE_CHUNK}
      - VITE_SSE_DONE=${SSE_DONE}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - node
    restart: unless-stopped

volumes:
  pgdata:
  ollama_data:
  huggingface_cache: # Persists model layers so they don't re-download every single time you restart docker